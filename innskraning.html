<!doctype html>
<html lang="is">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Innskráning | Netnám Tónsmiðju Suðurlands</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<main class="login-wrap">
  <a class="brand" href="index.html" style="justify-content:center">
    <img class="brand-logo" src="logo.png" alt="Tónsmiðja Suðurlands" onerror="this.onerror=null;this.src='https://tonsmidjan.net/wp-content/uploads/2024/04/Tonsmidja-FullLogo_Transparent.png'">
    <span class="brand-tag">NETNÁM</span>
  </a>

  <div class="login-card">
    <h1>Hver ert þú?</h1>
    <p class="muted" style="font-size:15px">Veldu notanda til að halda áfram.</p>

    <ul class="user-list" id="teachers" aria-label="Kennarar"></ul>

    <div class="user-divider"><span>eða</span></div>

    <a class="user-pick student" href="nemandi.html">
      <span class="avatar initials">N</span>
      <span class="user-text"><strong>Nemandi</strong><small>Skoða svæði nemanda</small></span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
    </a>
  </div>

  <p class="login-small">Sýnishorn: hver sem er getur valið notanda.</p>
</main>

<script>
  // Sýnishorn: engin lykilorð. Bættu kennurum við listann hér.
  const TEACHERS = [
    { name: 'Stefán', role: 'Kennari' },
    { name: 'Eyþór',  role: 'Kennari' },
  ];
  const arrow = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>';
  const list = document.getElementById('teachers');
  list.innerHTML = TEACHERS.map((t, i) => `
    <li><button class="user-pick" data-i="${i}">
      <span class="avatar">${t.name[0]}</span>
      <span class="user-text"><strong>${t.name}</strong><small>${t.role}</small></span>
      ${arrow}
    </button></li>`).join('');
  list.addEventListener('click', e => {
    const b = e.target.closest('[data-i]');
    if (!b) return;
    try { sessionStorage.setItem('tsn-kennari', TEACHERS[+b.dataset.i].name); } catch {}
    location.href = 'kennari.html';
  });
</script>
</body>
</html>
